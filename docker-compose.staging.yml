services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dreamlink-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamlink_staging}
      POSTGRES_USER: ${POSTGRES_USER:-dreamlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - dreamlink-postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dreamlink} -d ${POSTGRES_DB:-dreamlink_staging}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend/Dreamlink
      dockerfile: Dockerfile
    container_name: dreamlink-backend-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dreamlink_staging}
      DB_USERNAME: ${POSTGRES_USER:-dreamlink}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: staging
      AI_MATCHER_BASE_URL: ${AI_MATCHER_BASE_URL:-http://ai-matcher:8000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-matcher:
    build:
      context: ./matcher
      dockerfile: Dockerfile
    container_name: dreamlink-ai-matcher-staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dreamlink}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-dreamlink_staging}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://backend:8080}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Dream-Link Matcher}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-qwen/qwen3.5-flash-02-23}
      BACKEND_BASE_URL: http://backend:8080
    ports:
      - "8000:8000"

volumes:
  dreamlink-postgres-staging-data:
