name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scanner
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File ./scripts/secret_scan.ps1
        continue-on-error: false

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -DskipTests

